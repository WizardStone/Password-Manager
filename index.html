<!DOCTYPE html>
<html>
    <head>
        <title>Password Manager</title> 
        <link rel="icon" href="img/key.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="headings">
            <h1><strong><u>Password Manager</u></strong></h1>

            <br>

            <h2>Add new password:</h2>
        </div>

        <div id="dual-theme">
            <button id="dual-theme-button">
                <img src="img/light.png" height="50" width="50">
            </button>
        </div>

        <div id="username-password-input">
            <input id="username" placeholder="Enter Username">
            <div id="password cont">
                <input id="password" placeholder="Enter Password">
                <button id="hide-show-password"></button>
            </div>
            <button id="add-new-password">Add Password</button>
        </div>

        <div id="small-text">
            <small>NOTE! THIS SERVICE IS CASE SENSITIVE</small>
        </div>
    </body>
</html>
